services:
  - type: web
    name: flowsphere-api
    env: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: flowsphere-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 1d
      - key: CORS_ORIGIN
        value: '*' # Update this to your frontend URL once deployed
      - key: NODE_ENV
        value: production



databases:
  - name: flowsphere-db
    databaseName: flowsphere
    user: flowsphere_admin
    plan: free
    region: oregon
